server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API vive en el contenedor "backend"; mismo origen => la cookie funciona sin CORS.
    # DNS interno de Docker: resuelve "backend" en cada petición, así no falla
    # (502) cuando el contenedor de la API se recrea y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida carga index.html (React Router decide).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
